server:
  port: 8080

spring:
  application:
    name: sgqrplus-switch
  datasource:
    url: jdbc:h2:mem:sgqrplus;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

sgqrplus:
  cors:
    allowed-origins: http://localhost:5173
